[project]
name = "replay"
version = "0.1.0"
description = "The Replay kernel, stores and agent seams"
requires-python = ">=3.12"
dependencies = ["replay-events", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]
