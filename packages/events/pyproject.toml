[project]
name = "replay-events"
version = "0.1.0"
description = "The Replay event union — the single schema source for backend and frontend"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_events"]
